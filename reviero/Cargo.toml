[package]
name = "reviero"
version = "0.1.3"
edition = "2024"
rust-version = "1.89"
description = "Portable SIMD operations with runtime CPU dispatch"
license = "MIT"
repository = "https://github.com/maslenn1koff/reviero"
documentation = "https://docs.rs/reviero"
readme = "./README.md"
keywords = ["simd", "numerics", "vectorization", "performance"]
categories = ["algorithms", "hardware-support"]

[dependencies]
paste = "1"

[dev-dependencies]
criterion = "0.8"
pulp = "0.22"
wide = "1.7"

[[bench]]
name = "dot"
harness = false

[profile.bench]
opt-level = 3
lto = "thin"
codegen-units = 1